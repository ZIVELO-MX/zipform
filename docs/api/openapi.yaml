        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Revision conflict. }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: authjs.session-token
      description: Existing NextAuth browser session. Production may use the secure cookie prefix.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: tloz_
      description: |
        New agent API keys use `tloz_` followed by 64 hex characters.
        Legacy `zaf_` keys remain valid during the v1 grace release.
        To authenticate, include the header:
        ```
        Authorization: Bearer tloz_<64-hex-chars>
        ```
        If both Bearer token and session cookie are present, the Bearer token takes priority.
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devuelto como `nextCursor` por la página anterior. Un cursor vacío o inexistente responde 400 `INVALID_REQUEST`.
      schema:
        type: string
        minLength: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    MissionId:
      name: missionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    DocumentId:
      name: documentId
      in: path
      required: true
      description: Internal UUID or stable public ID such as TLO-0023.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted revision ETag returned by the previous read.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid path or query input.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: An authenticated session or valid API key is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: The authenticated actor is not permitted to perform this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: Unexpected server error. Details are recorded server-side.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServiceUnavailable:
      description: Private storage is unavailable or not configured.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    # ── Shared ───────────────────────────────────────────────────────
    DocumentKind:
      type: string
      enum: [project, mission, inventory]
    DocumentScalar:
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: array
          items:
            type: string
        - type: "null"
    FieldOption:
      type: object
      additionalProperties: false
      required: [value, label]
      properties:
        value:
          type: string
        label:
          type: string
        color:
          type: string
        role:
          type: string
          enum: [backlog, ready, active, blocked, done]
    FieldDefinition:
      type: object
      additionalProperties: false
      required: [key, label, type, required, visible, position, options]
      properties:
        id:
          type: string
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [text, number, boolean, date, select, multiselect, person, relation]
        required:
          type: boolean
        visible:
          type: boolean
        position:
          type: integer
          minimum: 0
        defaultValue:
          $ref: "#/components/schemas/DocumentScalar"
        options:
          type: array
          items:
            $ref: "#/components/schemas/FieldOption"
    ProjectContract:
      type: object
      required: [projectId, fields]
      properties:
        projectId:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldDefinition"
    Document:
      type: object
      required: [id, publicId, kind, title, summary, body, revision, properties, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        publicId:
          type: string
        kind:
          $ref: "#/components/schemas/DocumentKind"
        parentId:
          type: string
          format: uuid
        parentPublicId:
          type: string
        projectSlug:
          type: string
        title:
          type: string
        summary:
          type: string
        body:
          type: string
        revision:
          type: integer
          minimum: 1
        properties:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DocumentScalar"
        contract:
          $ref: "#/components/schemas/ProjectContract"
        children:
          type: object
          required: [data, nextCursor, total]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Document"
            nextCursor:
              oneOf:
                - type: string
                - type: "null"
            total:
              type: integer
              minimum: 0
        source:
          type: object
          required: [type, id]
          properties:
            type:
              $ref: "#/components/schemas/DocumentKind"
            id:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DocumentDefinition:
      type: object
      additionalProperties: false
      required: [id, key, kind, scope, fields, views, defaultView]
      properties:
        id:
          type: string
        key:
          type: string
        kind:
          $ref: "#/components/schemas/DocumentKind"
        scope:
          type: string
          enum: [collection, children]
        ownerDocumentId:
          type: string
          format: uuid
        fields:
          type: array
          items:
            type: object
            required: [key, label, format, position, visible]
            properties:
              key:
                type: string
              label:
                type: string
              format:
                type: string
                enum: [text, status, date, person, number, id]
              position:
                type: integer
              visible:
                type: boolean
              options:
                type: array
                items:
                  $ref: "#/components/schemas/FieldOption"
        views:
          type: array
          items:
            type: object
            required: [id, fields]
            properties:
              id:
                type: string
                enum: [dashboard, list, board, table, calendar, detail]
              fields:
                type: array
                items:
                  type: string
              groupBy:
                type: string
              dateField:
                type: string
        defaultView:
          type: string
          enum: [dashboard, list, board, table, calendar, detail]
    DocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Document"
    DocumentListResponse:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        nextCursor:
          oneOf:
            - type: string
            - type: "null"
    GlobalSearchResult:
      type: object
      additionalProperties: false
      required: [id, type, title, context, destination]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [project, mission, inventory, resource]
        title:
          type: string
        context:
          type: string
        destination:
          type: string
        publicId:
          type: string
    GlobalSearchResponse:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GlobalSearchResult"
        nextCursor:
          type: [string, "null"]
    DocumentCreate:
      type: object
      additionalProperties: false
      required: [kind, title]
      properties:
        kind:
          $ref: "#/components/schemas/DocumentKind"
        parentPublicId:
          type: string
        title:
          type: string
        summary:
          type: string
        body:
          type: string
        properties:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DocumentScalar"
        contract:
          description: Mission field contract. Only valid when kind is project.
          type: object
          additionalProperties: false
          required: [fields]
          properties:
            fields:
              type: array
              items:
                $ref: "#/components/schemas/FieldDefinition"
    DocumentUpdate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        summary:
          type: string
        body:
          type: string
        properties:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DocumentScalar"
    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, INTERNAL_ERROR, DOCUMENT_INVALID, DOCUMENT_NOT_FOUND, DOCUMENT_REVISION_CONFLICT, PRECONDITION_REQUIRED, INVALID_ATTACHMENT_MANIFEST, ATTACHMENT_STORAGE_NOT_CONFIGURED, ATTACHMENT_STORAGE_ERROR, attachment_object_missing, attachment_object_invalid, batch_superseded]
            message:
              type: string
            fields:
              type: object
              description: Field-specific guidance for INVALID_REQUEST responses.
              additionalProperties:
                type: string
            requestId:
              type: string

    # ── Users ────────────────────────────────────────────────────────
    User:
      type: object
      additionalProperties: false
      description: Operational profile. Email is omitted for agent:reader; passwords, sessions, API keys, and other authentication secrets are never exposed.
      required: [id, name, username, role, type, avatarUrl]
      properties:
        id:
          type: string
        name:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
          description: Omitted from responses to agent:reader.
        role:
          $ref: "#/components/schemas/UserRole"
        type:
          type: string
          enum: [human, agent]
        avatarUrl:
          type: string
          format: uri
        theme:
          type: string
          enum: [system, light, dark]
    UserListResponse:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        nextCursor:
          type: [string, "null"]
    UserRole:
      type: string
      enum: [Platform Owner, Full Stack Developer, agent:operative, agent:reader]

    # ── Projects ─────────────────────────────────────────────────────
    ProjectStatus:
      type: string
      enum: [planned, active, archived]
    Project:
      type: object
      additionalProperties: false
      required: [id, slug, name, description, color, icon, status, ownerId, startDate]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        descriptionDetail:
          type: string
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        icon:
          type: string
        status:
          $ref: "#/components/schemas/ProjectStatus"
        ownerId:
          type: string
        startDate:
          type: string
          format: date
        dueDate:
          type: [string, "null"]
          format: date
    ProjectListResponse:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        nextCursor:
          type: [string, "null"]

    # ── Missions ─────────────────────────────────────────────────────
    MissionStatus:
      type: string
      enum: [now, next, later, completed, blocked]
    MissionType:
      type: string
      enum: [main_quest, side_quest, farming_quest, exploration_quest]
    Mission:
      type: object
      additionalProperties: false
      required: [id, displayId, title, description, descriptionDetail, icon, type, status, ownerId, progress]
      properties:
        id:
          type: string
        displayId:
          type: string
        title:
          type: string
        description:
          type: string
          maxLength: 280
        descriptionDetail:
          type: string
          maxLength: 20000
        icon:
          type: string
        type:
          $ref: "#/components/schemas/MissionType"
        status:
          $ref: "#/components/schemas/MissionStatus"
        ownerId:
          type: string
        projectId:
          type: string
        seasonId:
          type: string
        episodeId:
          type: string
        dueDate:
          type: string
          format: date
        progress:
          type: integer
          minimum: 0
          maximum: 100
        completedAt:
          type: string
          format: date-time
        blockedReason:
          type: string
    MissionDetail:
      allOf:
        - $ref: "#/components/schemas/Mission"
        - type: object
          required: [checklist, checklistCount, completed, resources]
          properties:
            project:
              $ref: "#/components/schemas/Project"
            dependencies:
              type: array
              items:
                $ref: "#/components/schemas/Mission"
            questItems:
              type: array
              items:
                $ref: "#/components/schemas/QuestItem"
            checklist:
              type: array
              items:
                $ref: "#/components/schemas/ChecklistItem"
            checklistCount:
              type: integer
              minimum: 0
            completed:
              type: integer
              minimum: 0
            resources:
              type: array
              items:
                $ref: "#/components/schemas/Resource"
    MissionListResponse:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MissionDetail"
        nextCursor:
          type: [string, "null"]
    MissionBatchResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id:
                type: string
              data:
                $ref: "#/components/schemas/MissionDetail"
              error:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code:
                    type: string
                    enum: [NOT_FOUND]
                  message:
                    type: string

    # ── Seasons ──────────────────────────────────────────────────────
    Season:
      type: object
      additionalProperties: false
      required: [id, name, version, description, status, startDate]
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        description:
          type: string
        status:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: [string, "null"]
          format: date

    # ── Episodes ─────────────────────────────────────────────────────
    Episode:
      type: object
      additionalProperties: false
      required: [id, seasonId, name, romanNumber, description, status, startDate]
      properties:
        id:
          type: string
        seasonId:
          type: string
        name:
          type: string
        romanNumber:
          type: string
        description:
          type: string
        status:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: [string, "null"]
          format: date

    # ── Quest Items ──────────────────────────────────────────────────
    InventoryStatus:
      type: string
      enum: [locked, unlocked]
    InventoryCategory:
      type: string
      enum: [tool, access, asset, document, other]
    QuestItem:
      type: object
      additionalProperties: false
      required: [id, name, description, icon, status, category]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        status:
          $ref: "#/components/schemas/InventoryStatus"
        category:
          $ref: "#/components/schemas/InventoryCategory"
        ownerId:
          type: string
        acquiredAt:
          type: string
          format: date
    QuestItemListResponse:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/QuestItem"
        nextCursor:
          type: [string, "null"]

    # ── Resources ────────────────────────────────────────────────────
    AttachmentFile:
      type: object
      additionalProperties: false
      required: [key, title, fileName, contentType, sizeBytes, width, height]
      properties:
        key:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        title:
          type: string
          minLength: 1
          maxLength: 200
        fileName:
          type: string
          minLength: 1
          maxLength: 200
        contentType:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 6291456
        width:
          type: integer
          minimum: 1
          maximum: 10000
        height:
          type: integer
          minimum: 1
          maximum: 10000
    AttachmentManifest:
      type: object
      additionalProperties: false
      required: [groupKey, sourceRevision, files]
      properties:
        groupKey:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
          description: Stable machine key for the screenshot group.
        groupName:
          type: string
          minLength: 1
          maxLength: 80
          description: Optional client-defined display name. Existing groups without it fall back to a humanized groupKey.
        sourceRevision:
          type: string
          pattern: "^[0-9a-fA-F]{40}$"
        files:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/AttachmentFile"
    AttachmentUpload:
      allOf:
        - $ref: "#/components/schemas/AttachmentFile"
        - type: object
          required: [storagePath, uploadUrl]
          properties:
            storagePath:
              type: string
            uploadUrl:
              type: string
              format: uri
    AttachmentBatchPrepared:
      type: object
      required: [uploadBatchId, generation, groupKey, sourceRevision, status, uploads]
      properties:
        uploadBatchId:
          type: string
        generation:
          type: integer
          minimum: 1
        groupKey:
          type: string
        groupName:
          type: string
        sourceRevision:
          type: string
        status:
          type: string
          enum: [prepared, finalized]
        uploads:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentUpload"
    Attachment:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [groupKey, externalKey, contentType, sizeBytes, width, height, sourceRevision, url]
          properties:
            groupKey:
              type: string
            externalKey:
              type: string
            contentType:
              type: string
            sizeBytes:
              type: integer
            width:
              type: integer
            height:
              type: integer
            sourceRevision:
              type: string
            url:
              type: string
              format: uri
    AttachmentGroup:
      type: object
      required: [groupKey, sourceRevision, generation, attachments]
      properties:
        groupKey:
          type: string
        groupName:
          type: string
          description: Client-defined display name when supplied by the active batch.
        sourceRevision:
          type: string
        generation:
          type: integer
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
    AttachmentGroupResult:
      allOf:
        - $ref: "#/components/schemas/AttachmentGroup"
        - type: object
          required: [uploadBatchId, warnings]
          properties:
            uploadBatchId:
              type: string
            warnings:
              type: array
              items:
                type: string
    ResourceType:
      type: string
      enum: [link, document, image, file, note]
    ResourceInput:
      type: object
      additionalProperties: false
      required: [type, title]
      properties:
        type:
          $ref: "#/components/schemas/ResourceType"
        title:
          type: string
        url:
          type: string
          format: uri
        fileId:
          type: string
        icon:
          type: string
    Resource:
      type: object
      additionalProperties: false
      required: [id, type, title]
      properties:
        id:
          type: string
        missionId:
          type: string
        projectId:
          type: string
        questItemId:
          type: string
        type:
          $ref: "#/components/schemas/ResourceType"
        icon:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
        fileId:
          type: string
        groupKey:
          type: string
        groupName:
          type: string
          description: Resolved attachment group name when the resource is hydrated for Mission Detail.
        externalKey:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
        width:
          type: integer
        height:
          type: integer
        sourceRevision:
          type: string
    ResourceListResponse:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        nextCursor:
          type: [string, "null"]

    # ── Container/Content v2 contract (routes land in TLO-0077) ─────
    ContainerDefinition:
      type: object
      additionalProperties: false
      required: [fields, views, defaultView]
      properties:
        fields:
          type: array
          items:
            type: object
            additionalProperties: true
        views:
          type: array
          items:
            type: object
            additionalProperties: true
        defaultView:
          type: string
    Container:
      type: object
      additionalProperties: false
      required: [id, publicId, presentation, title, summary, body, definition, data, revision, createdAt, updatedAt]
      properties:
        id: { type: string }
        publicId: { type: string, minLength: 1 }
        slug: { type: string }
        presentation: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        summary: { type: string }
        body: { type: string }
        definition:
          $ref: "#/components/schemas/ContainerDefinition"
        data:
          type: object
          additionalProperties: true
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ContainerInput:
      type: object
      required: [publicId, presentation, title]
      properties:
        id: { type: string }
        publicId: { type: string, minLength: 1 }
        slug: { type: string }
        presentation: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        summary: { type: string }
        body: { type: string }
        definition: { $ref: "#/components/schemas/ContainerDefinition" }
        data: { type: object, additionalProperties: true }
    ContainerUpdate:
      type: object
      additionalProperties: false
      properties:
        slug: { type: string }
        presentation: { type: string }
        title: { type: string }
        summary: { type: string }
        body: { type: string }
        definition: { $ref: "#/components/schemas/ContainerDefinition" }
        data: { type: object, additionalProperties: true }
    ContainerResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Container" }
    ContainerListResponse:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Container" } }
        nextCursor: { type: [string, "null"] }
    Content:
      type: object
      additionalProperties: false
      required: [id, publicId, containerId, presentation, title, summary, body, data, revision, createdAt, updatedAt]
      properties:
        id: { type: string }
        publicId: { type: string, minLength: 1 }
        containerId: { type: string }
        presentation: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        summary: { type: string }
        body: { type: string }
        data:
          type: object
          additionalProperties: true
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ContentInput:
      type: object
      required: [publicId, containerId, presentation, title]
      properties:
        id: { type: string }
        publicId: { type: string, minLength: 1 }
        containerId: { type: string }
        presentation: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        summary: { type: string }
        body: { type: string }
        data: { type: object, additionalProperties: true }
    ContentUpdate:
      type: object
      additionalProperties: false
      properties:
        presentation: { type: string }
        title: { type: string }
        summary: { type: string }
        body: { type: string }
        data: { type: object, additionalProperties: true }
    ContentResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Content" }
    ContentListResponse:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Content" } }
        nextCursor: { type: [string, "null"] }
    ContainerContentError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [STORE_INVALID, STORE_NOT_FOUND, STORE_REVISION_CONFLICT, STORE_REFERENCE_INVALID, STORE_UNAVAILABLE]
        message: { type: string }
        fields:
          type: object
          additionalProperties:
            type: string

    # ── API Keys ─────────────────────────────────────────────────────
    ApiKey:
      type: object
      additionalProperties: false
      required: [id, userId, createdByUserId, name, keyPrefix, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        createdByUserId:
          type: string
        name:
          type: string
        keyPrefix:
          type: string
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApiKeyCreateResult:
      type: object
      additionalProperties: false
      required: [key, apiKey]
      properties:
        key:
          type: string
          description: "Raw API key (shown only once, begins with tloz_)"
        apiKey:
          $ref: "#/components/schemas/ApiKey"

    # ── Checklist Items ──────────────────────────────────────────────
    ChecklistItem:
      type: object
      additionalProperties: false
      required: [id, missionId, title, completed, position]
      properties:
        id:
          type: string
        missionId:
          type: string
        title:
          type: string
        completed:
          type: boolean
        position:
          type: integer
